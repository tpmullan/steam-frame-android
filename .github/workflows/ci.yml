name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  SHELL_FILES: bin/wgapps bin/fetch-images.sh tools/deploy.sh overrides/system/etc/wgapps-net.sh
  PY_FILES: bin/wgapps-pad bin/wgapps-ota bin/wgapps-gen-overrides bin/steam-shortcuts.py tests

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck $SHELL_FILES
      - name: shfmt
        run: |
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          chmod +x /usr/local/bin/shfmt
          shfmt -d $SHELL_FILES
      - name: ruff
        run: |
          pipx run ruff==0.13.0 check --no-cache $PY_FILES
          pipx run ruff==0.13.0 format --check $PY_FILES

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd tests && python -m unittest -v

  # A FROM scratch image of plain files: no emulation is needed to build the
  # arm64 variant (no RUN steps).
  image:
    needs: [lint, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/steam-frame-android
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "${GITHUB_REF_NAME#v}" > VERSION
          else
            echo "$(cat VERSION)+${GITHUB_SHA::8}" > VERSION
          fi
          echo "VERSION=$(cat VERSION)"
      - name: build and push
        run: |
          tags="--tag $IMAGE:${GITHUB_SHA::8} --tag $IMAGE:${GITHUB_REF_NAME//\//-}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tags="$tags --tag $IMAGE:latest"; fi
          docker buildx build --platform linux/arm64 --file Containerfile --push \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$(cat VERSION)" \
            --label "org.opencontainers.image.licenses=GPL-3.0-or-later" \
            $tags .
      - name: validate published layers
        run: |
          docker pull --platform linux/arm64 "$IMAGE:${GITHUB_SHA::8}"
          mkdir saved && docker save "$IMAGE:${GITHUB_SHA::8}" | tar -x -C saved
          for blob in saved/blobs/sha256/*; do tar -tf "$blob" 2>/dev/null || true; done |
            sed 's#/$##' | sort -u > image-files.txt
          cat image-files.txt
          for f in wgapps/bin/wgapps wgapps/bin/wgapps-pad wgapps/bin/wgapps-ota \
            wgapps/bin/wgapps-gen-overrides wgapps/bin/steam-shortcuts.py \
            wgapps/bin/fetch-images.sh wgapps/VERSION wgapps/LICENSE \
            wgapps/overrides/system/etc/init/z_wgapps.rc; do
            grep -qx "$f" image-files.txt || { echo "missing $f"; exit 1; }
          done
          if grep -E '\.(apk|img|zip|jar)$|vintf/manifest\.xml$|seccomp_policy/' image-files.txt; then
            echo "image contains files it must not ship"; exit 1
          fi
          if grep -vE '^wgapps(/|$)' image-files.txt; then echo "files outside /wgapps"; exit 1; fi
