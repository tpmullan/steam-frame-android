# Branches and merge requests: lint, tests, build the image into an archive
# inside the job and check it. Nothing is pushed to any registry.
# main also checks that the release token still works (read-only).
# vX.Y.Z tags (protected, pushed by the maintainer): the same build and
# check, then publish (tools/sfa_release.py publish). Other tags: no pipeline.
#
# Release variables (protected):
#   GITHUB_RELEASE_TOKEN  home group, masked: classic GitHub token with repo
#                         and write:packages
#   RELEASE_DENY          project, File: extended regexes that must never be
#                         published (internal host names, LAN ranges)

stages:
  - lint
  - test
  - deps
  - build

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$CI_PIPELINE_SOURCE =~ /^(push|web|merge_request_event)$/'

variables:
  IMAGE_REF: "$CI_REGISTRY_IMAGE/steam-frame-android"
  PUBLIC_REPO: https://github.com/tpmullan/steam-frame-android
  PUBLIC_IMAGE: ghcr.io/tpmullan/steam-frame-android
  SHELL_FILES: >-
    bin/wgapps bin/fetch-images.sh tools/deploy.sh tools/build-image.sh
    tools/build-libgbinder.sh tools/build-android-libs.sh tools/build-settings-app.sh overrides/system/etc/wgapps-net.sh
  PY_FILES: >-
    bin/wgapps-pad bin/wgapps-battery bin/wgapps-clipboard bin/wgapps-profiles bin/wgapps-appwatch bin/wgapps-ota bin/wgapps-gen-overrides bin/steam-shortcuts.py
    tools/sfa_release.py tests

# --- lint and tests --------------------------------------------------------

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:v0.10.0
  script:
    - shellcheck -x $SHELL_FILES

shfmt:
  stage: lint
  image: mvdan/shfmt:v3.10.0-alpine
  script:
    - shfmt -d $SHELL_FILES

ruff:
  stage: lint
  image: ghcr.io/astral-sh/ruff:0.13.0-alpine
  script:
    - ruff check --no-cache $PY_FILES
    - ruff format --check $PY_FILES

unit-tests:
  stage: test
  image: python:3.12-alpine
  needs: []
  script:
    - apk add --no-cache git bash >/dev/null
    - cd tests && python -m unittest -v

# --- build ---------------------------------------------------------------

# libgbinder for the host-side clipboard service, built natively on the arm64
# runners from pinned tarballs (tools/libgbinder.env). Its log shows the
# architecture, soname and dependencies of the result.
libgbinder:
  stage: deps
  image: debian:bookworm-slim
  needs: []
  script:
    - apt-get update -qq
    - >-
      apt-get install -y -qq --no-install-recommends
      build-essential pkg-config libglib2.0-dev curl ca-certificates >/dev/null
    - tools/build-libgbinder.sh lib
  artifacts:
    paths:
      - lib/
    expire_in: 30 days

# Our own Android libraries (xr-layer/, gbm-lock/), tested on the runner and then
# cross-compiled with the distribution's clang against pinned OpenXR headers
# (tools/xr-layer.env). Its log shows the test result and the library's
# architecture, soname and dependencies.
android-libs:
  stage: deps
  image: debian:bookworm-slim
  needs: []
  variables:
    HOST_CC: clang
  script:
    - apt-get update -qq
    - >-
      apt-get install -y -qq --no-install-recommends
      clang lld libc6-dev curl ca-certificates >/dev/null
    - tools/build-android-libs.sh lib
  artifacts:
    paths:
      - lib/
    expire_in: 30 days

# The release image is a FROM scratch bundle of files built on the arm64
# runners (COPY only, no RUN steps).
.build:
  stage: build
  image: docker:27.5.1
  services:
    - name: docker:27.5.1-dind
      alias: docker
  needs: [shellcheck, shfmt, ruff, unit-tests, libgbinder, android-libs]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    IMAGE_SOURCE: $PUBLIC_REPO
    IMAGE_REVISION: $CI_COMMIT_SHA
  before_script:
    - apk add --no-cache bash git python3 skopeo >/dev/null
    - |
      for attempt in $(seq 1 30); do
        docker version >/dev/null 2>&1 && break
        echo "Docker daemon not ready (attempt $attempt)" >&2
        sleep 2
      done
      docker version >/dev/null

build-image:
  extends: .build
  rules:
    - if: $CI_COMMIT_TAG == null
  script:
    - tools/build-image.sh "dev+$CI_COMMIT_SHORT_SHA" image.tar
    - python3 tools/sfa_release.py check-image oci-archive:image.tar

credentials:
  stage: build
  image: python:3.12-alpine
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables: &git_token
    # Supplies the token to git over HTTPS without putting it in a URL.
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: credential.helper
    GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$$GITHUB_RELEASE_TOKEN"; }; f'
  script:
    - apk add --no-cache git skopeo >/dev/null
    - python3 tools/sfa_release.py check-credentials

release:
  extends: .build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  resource_group: release
  variables:
    <<: *git_token
    GIT_DEPTH: "0"
    GIT_AUTHOR_NAME: Tom Mullaney
    GIT_AUTHOR_EMAIL: 2078150+tpmullan@users.noreply.github.com
    GIT_COMMITTER_NAME: Tom Mullaney
    GIT_COMMITTER_EMAIL: 2078150+tpmullan@users.noreply.github.com
  script:
    - tools/build-image.sh "${CI_COMMIT_TAG#v}" image.tar
    - python3 tools/sfa_release.py check-image oci-archive:image.tar
    - printf '%s' "$CI_REGISTRY_PASSWORD" | skopeo login --password-stdin -u "$CI_REGISTRY_USER" "$CI_REGISTRY"
    - printf '%s' "$GITHUB_RELEASE_TOKEN" | skopeo login --password-stdin -u tpmullan ghcr.io
    - python3 tools/sfa_release.py publish "$CI_COMMIT_TAG" image.tar
