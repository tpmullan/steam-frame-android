stages:
  - lint
  - test
  - build
  - validate
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

variables:
  IMAGE_REF: "$CI_REGISTRY_IMAGE/steam-frame-android"
  # Public release targets (release tags only, see release-public).
  PUBLIC_REPO: https://github.com/tpmullan/steam-frame-android
  PUBLIC_IMAGE: ghcr.io/tpmullan/steam-frame-android
  SHELL_FILES: "bin/wgapps bin/fetch-images.sh tools/deploy.sh tools/release.sh overrides/system/etc/wgapps-net.sh"
  PY_FILES: "bin/wgapps-pad bin/wgapps-ota bin/wgapps-gen-overrides bin/steam-shortcuts.py tests"

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:v0.10.0
  script:
    - shellcheck $SHELL_FILES

shfmt:
  stage: lint
  image: mvdan/shfmt:v3.10.0-alpine
  script:
    - shfmt -d $SHELL_FILES

ruff:
  stage: lint
  image: ghcr.io/astral-sh/ruff:0.13.0-alpine
  script:
    - ruff check --no-cache $PY_FILES
    - ruff format --check $PY_FILES

unit-tests:
  stage: test
  image: python:3.12-slim
  needs: []
  script:
    - cd tests && python -m unittest -v

# A FROM scratch image of plain files: no emulation is needed to build the
# arm64 variant on the amd64 runners (no RUN steps).
.docker:
  image: docker:27.5.1
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - |
      for attempt in $(seq 1 30); do
        docker version >/dev/null 2>&1 && break
        echo "Docker daemon not ready (attempt $attempt)" >&2
        sleep 2
      done
      docker version >/dev/null
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build-image:
  stage: build
  extends: .docker
  needs: [shellcheck, shfmt, ruff, unit-tests]
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "${CI_COMMIT_TAG#v}" > VERSION
      else
        echo "$(cat VERSION)+${CI_COMMIT_SHORT_SHA}" > VERSION
      fi
      echo "VERSION=$(cat VERSION)"
    - docker buildx create --use --name sfa-builder --driver docker-container
    - |
      tags="--tag $IMAGE_REF:$CI_COMMIT_SHORT_SHA --tag $IMAGE_REF:$CI_COMMIT_REF_SLUG"
      if [ -n "$CI_COMMIT_TAG" ]; then
        tags="$tags --tag $IMAGE_REF:$CI_COMMIT_TAG --tag $IMAGE_REF:latest"
      fi
      # No provenance/SBOM attestations: they record the build context's git
      # remote and registry names (internal hostnames) and would be published.
      docker buildx build --platform linux/arm64 --file Containerfile --push \
        --provenance=false --sbom=false \
        --label "org.opencontainers.image.source=$PUBLIC_REPO" \
        --label "org.opencontainers.image.licenses=GPL-3.0-or-later" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.version=$(cat VERSION)" \
        $tags .

# Fails if an image (manifest, config or any layer) carries attestations or
# internal names. Usage: check_image_clean <ref> (docker logged in).
.leak_check: &leak_check |
  check_image_clean() {
    ref="$1"
    raw="$(docker buildx imagetools inspect --raw "$ref")"
    if printf '%s' "$raw" | grep -q -E 'attestation-manifest|image\.index|manifest\.list'; then
      echo "$ref is an index or carries attestations"; exit 1
    fi
    dir="$(mktemp -d)"
    docker pull -q --platform linux/arm64 "$ref" >/dev/null
    docker save "$ref" | tar -x -C "$dir"
    printf '%s' "$raw" > "$dir/registry-manifest.json"
    pat="$CI_SERVER_HOST|$CI_REGISTRY|svc\.cluster\.local|\.tun\."
    if [ -f "${RELEASE_DENY:-}" ]; then
      extra="$(grep -v -E '^[[:space:]]*(#|$)' "$RELEASE_DENY" | paste -sd '|' -)"
      [ -n "$extra" ] && pat="$pat|$extra"
    fi
    # Only the image itself: its blobs and the registry manifest. docker
    # save's own index.json/manifest.json/repositories name the local ref.
    if grep -r -a -l -E "$pat" "$dir/blobs" "$dir/registry-manifest.json"; then
      echo "$ref contains internal names (files above)"; exit 1
    fi
    rm -rf "$dir"
    echo "$ref: single manifest, no internal names"
  }

validate-image:
  stage: validate
  extends: .docker
  needs: [build-image]
  script:
    - *leak_check
    - check_image_clean "$IMAGE_REF:$CI_COMMIT_SHORT_SHA"
    - docker pull --platform linux/arm64 "$IMAGE_REF:$CI_COMMIT_SHORT_SHA"
    # List what the published layers contain (docker export would add
    # .dockerenv, etc/hosts and so on, which are not in the image).
    - mkdir saved && docker save "$IMAGE_REF:$CI_COMMIT_SHORT_SHA" | tar -x -C saved
    - |
      for blob in saved/blobs/sha256/*; do
        tar -tf "$blob" 2>/dev/null || true
      done | sed 's#/$##' | sort -u > image-files.txt
    - cat image-files.txt
    # Our files are present.
    - |
      for f in wgapps/bin/wgapps wgapps/bin/wgapps-pad wgapps/bin/wgapps-ota \
        wgapps/bin/wgapps-gen-overrides wgapps/bin/steam-shortcuts.py \
        wgapps/bin/fetch-images.sh wgapps/VERSION wgapps/LICENSE \
        wgapps/overrides/system/etc/init/z_wgapps.rc; do
        grep -qx "$f" image-files.txt || { echo "missing $f"; exit 1; }
      done
    # Nothing from Waydroid or Google: no APKs, images, archives, and none
    # of the files that are generated on the Frame from Waydroid's vendor image.
    - |
      if grep -E '\.(apk|img|zip|jar)$|vintf/manifest\.xml$|seccomp_policy/' image-files.txt; then
        echo "image contains files it must not ship"; exit 1
      fi
    - |
      if grep -vE '^wgapps(/|$)' image-files.txt; then
        echo "files outside /wgapps"; exit 1
      fi
  artifacts:
    when: always
    paths:
      - image-files.txt
    expire_in: 14 days

# Release tags (vX.Y.Z, protected) publish the validated image to GHCR and a
# snapshot commit plus tag to the public GitHub repository. Nothing runs on
# GitHub. Needs two protected CI variables set in GitLab by the maintainer:
#   GITHUB_RELEASE_TOKEN  classic token with public_repo (or repo) and
#                         write:packages, masked
#   RELEASE_DENY          File variable: extended regexes that must not appear
#                         in released files (internal hostnames, LAN ranges)
release-public:
  stage: release
  extends: .docker
  needs: [validate-image]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  variables:
    GIT_DEPTH: "0"
    GIT_AUTHOR_NAME: Tom Mullaney
    GIT_AUTHOR_EMAIL: 2078150+tpmullan@users.noreply.github.com
    GIT_COMMITTER_NAME: Tom Mullaney
    GIT_COMMITTER_EMAIL: 2078150+tpmullan@users.noreply.github.com
    # Supplies the token to git over HTTPS without putting it in a URL.
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: credential.helper
    GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$$GITHUB_RELEASE_TOKEN"; }; f'
  script:
    - test -n "$GITHUB_RELEASE_TOKEN" || { echo "GITHUB_RELEASE_TOKEN is not set"; exit 1; }
    - test -f "$RELEASE_DENY" || { echo "RELEASE_DENY file variable is not set"; exit 1; }
    - apk add --no-cache bash git >/dev/null
    - printf '%s' "$GITHUB_RELEASE_TOKEN" | docker login ghcr.io -u tpmullan --password-stdin
    - *leak_check
    - check_image_clean "$IMAGE_REF:$CI_COMMIT_TAG"
    # Code first: release.sh refuses deny-listed content and existing tags,
    # so a failure here publishes nothing.
    - RELEASE_REMOTE="$PUBLIC_REPO.git" bash tools/release.sh "$CI_COMMIT_TAG" HEAD
    - docker buildx imagetools create --tag "$PUBLIC_IMAGE:$CI_COMMIT_TAG" --tag "$PUBLIC_IMAGE:latest" "$IMAGE_REF:$CI_COMMIT_TAG"
    - check_image_clean "$PUBLIC_IMAGE:$CI_COMMIT_TAG"
